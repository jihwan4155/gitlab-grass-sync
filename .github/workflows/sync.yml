name: Sync GitLab grass

on:
  schedule:
    - cron: "0 15 * * *" # 매일 UTC 15:00 = KST 자정
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "jihwan"
          git config user.email "jihwan4155@gmail.com"

      - name: Run sync
        env:
          GITLAB_URL: https://lab.ssafy.com
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_EMAILS: ${{ secrets.GITLAB_EMAILS }}
        run: python3 sync_grass.py

      - name: Push
        run: git push
